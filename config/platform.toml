# harness-lab 給 Teamind 主機工作表的平台設定（HL-1）：Teamind 的派工與主機探測經 tools/platform_config.py 讀它。

# 只在總部讀，`<workdir>/le/ledger/*.json`，替專案自己的派工程式計時（Teamind TM-227）。不是主機上的資料夾：
