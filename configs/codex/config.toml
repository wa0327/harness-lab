# Codex 專用設定（CODEX_HOME 指向專案內 .home/codex，不影響 ~/.codex）
# 接 scripts/serve-main.sh 起的 llama-server

model = "qwen3.6-35b-a3b"
model_provider = "harness-lab"
model_context_window = 131072   # qwen 的 CTX；用 glm 時伺服器只有 65536，要另外 -c model_context_window=65536

# 思考強度（minimal、low、medium、high、xhigh…），經 Responses API 的 reasoning.effort 送出。
# 實測 llama-server（Qwen）只認 "none"＝不思考，minimal、low、medium 都照樣思考；預設不設＝思考。
# 伺服器端的 scripts/serve-main.sh --reasoning off 只改預設值，自己帶開關的用戶端（例如 Pi）照樣會思考
# model_reasoning_effort = "low"

[model_providers.harness-lab]
name = "llama.cpp (harness-lab)"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"
env_key = "API_KEY"

# MODEL=ds4：KK 的 Mac 上的 DeepSeek V4 Flash（ds4.c，經 Tailscale）。用法：codex -c model_provider=ds4 -m deepseek-v4-flash
# 伺服器支援 Responses API 和 reasoning.effort（none 關掉思考）。不驗證 key，用 DS4_API_KEY 免得送出這台的 API_KEY
[model_providers.ds4]
name = "DeepSeek V4 Flash (ds4)"
base_url = "http://100.82.105.90:8000/v1"
wire_api = "responses"
env_key = "DS4_API_KEY"
